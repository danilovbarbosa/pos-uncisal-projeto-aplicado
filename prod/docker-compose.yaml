services:
  web:
    image: danilovbarbosa/projeto-pos-sec:${APP_TAG:?defina APP_TAG}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DB_PATH: /app/data/db.sqlite3
    volumes:
      # Estáticos coletados pelo web e servidos pelo Nginx.
      - static_volume:/app/staticfiles
      # Banco de dados persistente.
      - data_volume:/app/data
    expose:
      - "8000"
    networks:
      - appnet

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - static_volume:/app/staticfiles:ro
    # Recarrega o nginx a cada 6h para pegar certificados renovados
    command: >
      /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g "daemon off;"'
    networks:
      - appnet

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Tenta renovar a cada 12h (só renova quando faltarem < 30 dias)
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  static_volume:
  data_volume:
