{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Portal Seguro{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #e2e8f0;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      width: min(420px, 92vw);
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    h1 { margin-top: 0; font-size: 1.4rem; }
    label { display: block; margin: .75rem 0 .25rem; font-size: .9rem; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: .6rem .7rem; border-radius: 8px;
      border: 1px solid #334155; background: #0f172a; color: #e2e8f0;
    }
    button {
      margin-top: 1.2rem; width: 100%; padding: .7rem;
      border: 0; border-radius: 8px; cursor: pointer;
      background: #2563eb; color: white; font-size: 1rem;
    }
    button:hover { background: #1d4ed8; }
    .errors, .messages { list-style: none; padding: 0; margin: .5rem 0; }
    .errors li, .msg-error { color: #fca5a5; font-size: .9rem; }
    .msg-success { color: #86efac; }
    .muted { color: #94a3b8; font-size: .85rem; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .logout-btn { width: auto; margin: 0; padding: .5rem .9rem; background: #dc2626; }
    .logout-btn:hover { background: #b91c1c; }
  </style>
</head>
<body>
  <main class="card">
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="msg-{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
