# =====================================================================
# Nginx como proxy reverso com terminação TLS (HTTPS)
# =====================================================================

upstream django_app {
    # Nome do serviço 'web' na rede do docker-compose.
    server web:8000;
}

# ---------------------------------------------------------------------
# HTTP: redireciona todo o tráfego para HTTPS (OWASP A02/A04).
# ---------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Redirecionamento permanente para HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------
# HTTPS: termina o TLS e faz o proxy para o Gunicorn.
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    # Certificado autoassinado (montado via volume).
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    # Boas práticas de TLS.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Limita o tamanho do corpo das requisições.
    client_max_body_size 10m;

    # Cabeçalhos de segurança adicionais no proxy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Arquivos estáticos servidos diretamente pelo Nginx (mais eficiente).
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 7d;
    }

    # Todo o resto vai para a aplicação Django/Gunicorn.
    location / {
        proxy_pass http://django_app;
        proxy_http_version 1.1;

        # Cabeçalhos que o Django usa para saber o host/protocolo reais.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Informa ao Django que a requisição original é HTTPS
        # (usado por SECURE_PROXY_SSL_HEADER).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_redirect off;
    }
}
