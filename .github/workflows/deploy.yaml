name: deploy
on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/projeto-pos-sec:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/projeto-pos-sec:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.PATH_APP }}
            if grep -q '^APP_TAG=' .env; then
              sed -i "s|^APP_TAG=.*|APP_TAG=${{ github.sha }}|" .env
            else
              [ -n "$(tail -c1 .env)" ] && echo >> .env
              echo "APP_TAG=${{ github.sha }}" >> .env
            fi
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f